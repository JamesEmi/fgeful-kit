<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fgeful-kit</title><style>
@font-face{font-family:Lato;src:url(assets/Lato-Regular.ttf)}@font-face{font-family:Lato;src:url(assets/Lato-Bold.ttf);font-weight:700}
*{box-sizing:border-box}html,body{margin:0;background:#080f19;color:#edf6fa;font-family:Lato,Arial,sans-serif;overflow:hidden}#stage{width:1920px;height:1080px;position:absolute;transform-origin:0 0;background:radial-gradient(ellipse at 55% 60%,#152b3b,#0d1b2a 47%,#080f19 85%);overflow:hidden}canvas{position:absolute;inset:0;width:1920px;height:1080px}#overlay{pointer-events:none}header{position:absolute;left:76px;right:76px;top:40px;z-index:3}#eyebrow{font-size:22px;letter-spacing:3px;color:#65dfc4;font-weight:700}h1{font-size:88px;line-height:1.2;margin:18px 0 16px;letter-spacing:-1.6px}#sub{font-size:40px;line-height:1.2;color:#b5c6d4}#insight{position:absolute;left:76px;right:76px;bottom:112px;padding:13px 20px;font-size:42px;line-height:1.15;background:#0a1724e8;border-left:3px solid #65dfc4;z-index:4}.shade{position:absolute;inset:0 0 auto;height:280px;background:linear-gradient(#080f19,rgba(8,15,25,.65) 80%,transparent);pointer-events:none}.bottom{position:absolute;bottom:0;width:100%;height:180px;background:linear-gradient(transparent,#080f19);pointer-events:none}#footer{position:absolute;left:76px;right:76px;bottom:36px;display:flex;align-items:center;justify-content:space-between;font-size:24px;color:#8fa6b9}#steps{display:flex;gap:14px}.step{font-size:29px;padding:9px 17px;border:1px solid #294155;border-radius:10px}.step.active{color:#d2fff5;border-color:#51b39f;background:#10372f}#provenance{font-size:20px;color:#8da6b9;text-align:right;max-width:690px}#progress{position:absolute;bottom:0;left:0;height:3px;background:#65dfc4}#loading{position:absolute;top:470px;left:76px;font-size:28px}#controls{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:20;background:#0b172eee;border:1px solid #3a556c;border-radius:22px;padding:8px 15px;display:flex;gap:12px;align-items:center;opacity:0}body:hover #controls{opacity:1}#play{border:0;background:transparent;color:#edf6fa;font-size:18px;cursor:pointer}#seek{width:460px}#clock{font-size:14px;color:#b5c6d4}body.capture #controls{display:none}
